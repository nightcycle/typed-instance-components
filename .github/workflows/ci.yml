name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck=
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
      - name: Install dependencies and pinned definitions
        run: lune run scripts/dev/setup.lune.luau
      - name: Generated API, regression tests, formatting and strict types
        run: lune run scripts/checks/run.lune.luau
      - name: Verify dependency lockfile
        run: git diff --exit-code -- wally.lock
      - name: Build and verify Wally archive and Rojo models
        run: lune run scripts/build/run.lune.luau
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typed-instance-components-${{ github.sha }}
          path: Generated/build/*
          if-no-files-found: error
          retention-days: 14
